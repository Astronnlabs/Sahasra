# Public website: sahaasra.in and www.sahaasra.in (static files from the repository's website/ folder).
# certbot adds the https part to this file.
server {
    listen 80;
    listen [::]:80;
    server_name sahaasra.in www.sahaasra.in;

    root /srv/sahasra/app/website;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    location /assets/ {
        expires 1h;
    }
    # The app lives on app.sahaasra.in; old /login and /signup links still work.
    location ~ ^/(login|signup)$ {
        return 301 https://app.sahaasra.in$request_uri;
    }
}
