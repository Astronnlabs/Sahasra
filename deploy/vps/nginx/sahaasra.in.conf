# Public website: sahaasra.in and www.sahaasra.in (React site built from the repository's website/ folder).
# certbot adds the https part to this file.
server {
    listen 80;
    listen [::]:80;
    server_name sahaasra.in www.sahaasra.in;

    root /srv/sahaasra/app/website/dist;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Built files have a hash in their name, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    # The React app itself (every page below falls back to it).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    # Old links: /pricing.html -> /pricing
    location ~ ^/(.+)\.html$ {
        return 301 /$1;
    }
    # The app lives on app.sahaasra.in; /login and /signup links still work.
    location ~ ^/(login|signup)$ {
        return 301 https://app.sahaasra.in$request_uri;
    }
    # Every page is handled by the React app.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
