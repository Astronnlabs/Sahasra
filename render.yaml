services:
  - type: web
    name: sahasra
    runtime: node
    plan: free
    region: singapore
    buildCommand: >-
      npm ci --include=dev && npm run build &&
      cd backend && npm ci --include=dev && npx prisma generate && npm run build &&
      npx prisma migrate deploy
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: UPLOAD_DIR
        value: ./uploads
      # E-billing: bills are sent through VAAHAK. TOKEN_ENCRYPTION_KEY encrypts each business's VAAHAK key.
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: VAAHAK_API_URL
        value: https://vaahak.onrender.com
